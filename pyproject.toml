[project]
name = "dikte"
version = "0.2.0"
description = "Türkçe odaklı, GPU destekli yerel diktasyon uygulaması (Windows 11)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.7",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "faster-whisper>=1.1.0",
  "ctranslate2>=4.5",
  "ollama>=0.4",
  "pydantic>=2.7",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=2"]
gemini = ["google-genai>=1.30"]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5", "ruff>=0.5", "pyinstaller>=6.6"]

[project.scripts]
dikte = "dikte.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # scripts/ paket değil; benchmark modülü testlerden içe aktarılır
markers = ["gpu: CUDA gerektirir", "win: yalnızca Windows"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Markdown içindeki örnek kod blokları kasıtlı olarak kısaltılmıştır (AGENTS.md "KÖTÜ/İYİ"
# örnekleri, plan dosyaları); ruff 0.16+ bunları biçimlendirmesin.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "BLE", "N", "PTH"]
ignore = [
  # Türkçe metinlerdeki Unicode karakterler (ı, ş, ğ...) kasıtlıdır.
  "RUF001",
  "RUF002",
  "RUF003",
  # Qt olay yöntemleri (paintEvent, eventFilter...) camelCase olmak zorunda.
  "N802",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "BLE001", "N817", "RUF012", "RUF059"]

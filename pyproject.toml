[project]
name = "dikte"
version = "0.2.0"
description = "Türkçe odaklı, GPU destekli, tamamen yerel masaüstü diktasyon uygulaması (Windows 11 ve Linux)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sarpel GÜRAY" }]
keywords = ["dictation", "speech-to-text", "whisper", "faster-whisper", "turkish", "ollama", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Environment :: X11 Applications :: Qt",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Turkish",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "faster-whisper>=1.1.0",
  "ctranslate2>=4.5",
  "ollama>=0.5",  # ollama_provider.py her zaman think= gönderiyor, 0.5'te eklendi
  "pydantic>=2.7",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9"]
anthropic = ["anthropic>=1.0"]  # 0.x ANTHROPIC_AUTH_TOKEN'ı Bearer olarak sızdırabilir
openai = ["openai>=2"]
gemini = ["google-genai>=1.30"]
# Windows'ta kayıt sırasında medyayı duraklatma (WinRT oturum yöneticisi, pywinrt); Linux
# playerctl kullanır. Foundation `await` için, Foundation.Collections oturum listesi için gerekli.
media = [
  "winrt-runtime>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Media.Control>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "pytest-cov>=5",
  "ruff>=0.16",  # ci.yml'nin sabitlediği sürümle eşleşmeli, aksi hâlde yerel lint CI'dan sapar
  "pyinstaller>=6.6",
  "pyright>=1.1.390",
  # Tip denetimi için opsiyonel sağlayıcı SDK'ları da kurulu olmalı.
  "anthropic>=1.0",
  "openai>=2",
  "google-genai>=1.30",
]

[project.scripts]
dikte = "dikte.app:main"

[project.urls]
Homepage = "https://github.com/sarpel/diktasyon-uygulamasi"
Issues = "https://github.com/sarpel/diktasyon-uygulamasi/issues"
Changelog = "https://github.com/sarpel/diktasyon-uygulamasi/blob/main/CHANGELOG.md"

[build-system]
# 77+: PEP 639 `license = "MIT"` ifadesi ve `license-files` alanı için.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # scripts/ paket değil; benchmark modülü testlerden içe aktarılır
markers = ["gpu: CUDA gerektirir", "win: yalnızca Windows"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["scripts"]  # eval_* modülleri paket değil; testler doğrudan içe aktarır
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
# Windows'a özgü modüller (winreg, ctypes.windll) Linux'ta çözümlenemez; "All" her iki
# platformun dallarını da analiz eder.
pythonPlatform = "All"

[tool.ruff.format]
# Markdown içindeki örnek kod blokları kasıtlı olarak kısaltılmıştır (AGENTS.md "KÖTÜ/İYİ"
# örnekleri, plan dosyaları); ruff 0.16+ bunları biçimlendirmesin.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "BLE", "N", "PTH"]
ignore = [
  # Türkçe metinlerdeki Unicode karakterler (ı, ş, ğ...) kasıtlıdır.
  "RUF001",
  "RUF002",
  "RUF003",
  # Qt olay yöntemleri (paintEvent, eventFilter...) camelCase olmak zorunda.
  "N802",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "BLE001", "N817", "RUF012", "RUF059"]

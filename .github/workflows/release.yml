name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    # Yalnızca bu iş (release oluşturma) yazma yetkisine ihtiyaç duyuyor; workflow
    # düzeyinde tanımlamak yerine burada kapsamlamak GITHUB_TOKEN'ın etki alanını daraltır.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -e ".[dev,cuda]"

      - name: Testler
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: İkonu üret
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/make_icon.py

      - name: PyInstaller paketi
        run: pyinstaller --noconfirm --clean packaging/dikte.spec

      - name: Duman testi (paketlenmiş exe --version)
        # --version desteklenmezse uygulama arayüzü açıp beklerdi; iş takılı kalmasın.
        timeout-minutes: 3
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\Dikte\Dikte.exe" -ArgumentList "--version" `
            -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Dikte.exe --version çıkış kodu $($proc.ExitCode); paket bozuk olabilir."
            exit 1
          }

      - name: Sürümü pyproject.toml'dan oku
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if (-not $version) { Write-Error "pyproject.toml'da sürüm bulunamadı"; exit 1 }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Inno Setup kurulumu
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Kurulum paketi
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" packaging\installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: Dikte-windows
          path: |
            dist/Dikte/
            dist/Dikte-Setup-*.exe
          retention-days: 30

      - name: GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Dikte-Setup-*.exe
          generate_release_notes: true

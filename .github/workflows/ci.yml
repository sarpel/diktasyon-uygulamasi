name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main/master'a art arda push'larda iptal etmek, main dalının hiç yeşil geçmemiş bir
  # commit'te takılı kalmasına yol açabilir; yalnızca PR çalışmaları (aynı dalın yeni bir
  # push'la geçersiz kıldığı ara denemeler) iptal edilir.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.16.*
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Qt ve ses kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libportaudio2

      - name: Bağımlılıklar
        # `media` extra'sı yalnızca Windows'ta paket kurar (winrt-*); burada kurularak her
        # Python sürümünde wheel'lerin çözülebildiği de doğrulanır.
        run: pip install -e ".[dev,anthropic,openai,gemini,media]"

      - name: Testler
        # AGENTS.md: %80 asgari kapsam kuralı; CI bunu zorunlu kılmıyordu, düşen kapsam
        # sessizce yeşil geçerdi.
        run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=80

  # Bir sonraki Python sürümü için erken uyarı. Bağımlılıkların (PySide6, ctranslate2,
  # onnxruntime) o sürüm için wheel yayımlaması beklenir; o zamana kadar kırmızı kalması
  # beklenen bir durumdur ve PR'ı engellemez. Yeşile döndüğünde ana matrise taşınır.
  test-next-python:
    needs: lint
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Qt ve ses kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libportaudio2

      - name: Bağımlılıklar
        run: pip install -e ".[dev,media]"

      - name: Testler
        run: pytest -q

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,anthropic,openai,gemini]"
      - run: pyright

  desktop-entry:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck
      - run: desktop-file-validate packaging/linux/dikte.desktop
      - run: shellcheck packaging/linux/install.sh
